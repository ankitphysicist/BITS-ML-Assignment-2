name: Build and Save ML Models

on:
  push:
    paths:
      - ".github/workflows/build-models.yml"
      - "train_models.py"
      - "evaluation.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Train models (never on test data)
        run: python train_models.py
      - name: Run core tests
        run: python -m pytest -q
      - name: Commit reproducible model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/*.joblib metadata.json dataset.csv test_data.csv model_comparison.csv
          if ! git diff --cached --quiet; then
            git commit -m "build: save five trained classification models"
            git push
          fi
