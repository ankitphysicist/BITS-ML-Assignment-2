name: Verify ML and Streamlit App

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "evaluation.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify Python syntax
        run: python -m compileall -q app.py evaluation.py train_models.py
      - name: Test saved model predictions and Streamlit frontend
        run: python -m pytest -q
