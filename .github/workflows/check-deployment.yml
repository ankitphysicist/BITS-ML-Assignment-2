name: Check Public Streamlit Deployment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-deployment.yml"

permissions:
  contents: read

jobs:
  public-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage HTTP accessibility
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 10 --retry-all-errors -fL -sS --max-time 20 \
            "https://ankit-ml-assignment-2.streamlit.app/" -o /tmp/streamlit_home.html
          if ! grep -iq streamlit /tmp/streamlit_home.html; then
            echo "URL responded but the expected Streamlit HTML marker was not found."
            exit 1
          fi
          echo "Public Streamlit HTML is reachable."
      - name: Check Streamlit health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 10 --retry-all-errors -fL -sS --max-time 20 \
            "https://ankit-ml-assignment-2.streamlit.app/_stcore/health"
